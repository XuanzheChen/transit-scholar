version: 2

storage:
  tasks_root: "tasks"
  active_task_file: ".agentic-sdlc/active-task.json"
  preserve_raw_outputs: true

workflow:
  default_mode: "direct"
  explicit_start_required: true
  max_function_packages: 3
  max_generator_revisions: 2
  max_evaluator_revalidations: 2
  require_git_worktree: true
  forbid_repository_copy_fallback: true
  forbid_format_only_model_retry: true
  require_user_approval:
    requirements: true
    destructive_data_operation: true
    acceptance_new_product_decision: true
    final_delivery: false

init:
  required: true
  init_record_file: ".agentic-sdlc/init.json"
  discover_agents_command:
    - "python"
    - ".agents/skills/multi-agent-sdlc/scripts/discover_agents.py"
  add_tasks_root_to_gitignore: true

agents:
  planner:
    role_file: ".agentic-sdlc/roles/planner.md"
    invocation:
      type: "local-main-agent"

  generator:
    role_file: ".agentic-sdlc/roles/generator.md"
    identity:
      provider: "TO_BE_SELECTED_DURING_INIT"
      require_external: true
      allow_simulation: false
      allow_local_subagent: false
    invocation:
      type: "external-command"
      command:
        - "TO_BE_SELECTED_DURING_INIT"
        - "{prompt_file}"
      timeout_seconds: 3600
      mode: "edit"

  evaluator:
    role_file: ".agentic-sdlc/roles/evaluator.md"
    identity:
      provider: "TO_BE_SELECTED_DURING_INIT"
      require_external: true
      allow_simulation: false
      allow_local_subagent: false
    invocation:
      type: "external-command"
      command:
        - "TO_BE_SELECTED_DURING_INIT"
        - "{prompt_file}"
      timeout_seconds: 3600
      mode: "read_only"

state_machine:
  initial: "requirements_draft"
  terminal: ["done", "blocked"]
  normal_path:
    - "requirements_draft"
    - "requirements_user_review"
    - "acceptance_design"
    - "acceptance_planner_review"
    - "generator_plan"
    - "generator_plan_planner_review"
    - "generator_plan_user_review"
    - "implementation"
    - "evaluation"
    - "final_planner_review"
    - "done"
  revision_state: "revision"

commands:
  test:
    default: []
  lint:
    default: []
  typecheck:
    default: []
